name: dkaudalia
services:
  postgres:
    image: postgres:14-alpine
    container_name: dkaudalia_postgres

    environment:
      POSTGRES_DB: dkaudalia
      POSTGRES_USER: dkaudalia
      POSTGRES_PASSWORD: dkaudalia_password

    ports:
      - "5432:5432"

    volumes:
      - dkaudalia_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U dkaudalia -d dkaudalia",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dkaudalia_postgres_data: